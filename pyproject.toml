[project]
name = "runstatus"
version = "0.2.0"
description = "Generic training status file writer (HF callback, wandb hook, manual API)"
requires-python = ">=3.9"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
